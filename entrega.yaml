apiVersion: v1
kind: Namespace
metadata:
  name: ns-david-contardo

---

apiVersion: v1
kind: ConfigMap
metadata:
  name: config-david-contardo
  namespace: ns-david-contardo
data:
  AMBIENTE: produccion

---

apiVersion: v1
kind: Secret
metadata:
  name: secret-david-contardo
  namespace: ns-david-contardo
type: Opaque
stringData:
  API_KEY: lab3-david-contardo-key

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-david-contardo
  namespace: ns-david-contardo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: app-david-contardo
  template:
    metadata:
      labels:
        app: app-david-contardo
    spec:
      containers:
        - name: app
          image: dcontardo/lab3:david-contardo
          ports:
            - containerPort: 3000
          env:
            - name: AMBIENTE
              valueFrom:
                configMapKeyRef:
                  name: config-david-contardo
                  key: AMBIENTE
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: secret-david-contardo
                  key: API_KEY

---

apiVersion: v1
kind: Service
metadata:
  name: svc-david-contardo
  namespace: ns-david-contardo
spec:
  selector:
    app: app-david-contardo
  ports:
    - port: 80
      targetPort: 3000
